name: Publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: clipper-release-publication
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release source
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Allow the SDK sandbox to write test artifacts
        run: chmod -R a+rwX "$GITHUB_WORKSPACE"

      - name: Install GNOME 51 runtime and SDK
        run: flatpak install --noninteractive flathub org.gnome.Platform//51 org.gnome.Sdk//51

      - name: Install test dependencies
        run: |
          flatpak run \
            --share=network \
            --filesystem="$GITHUB_WORKSPACE" \
            --command=sh org.gnome.Sdk//51 -c "
              set -e
              cd \"$GITHUB_WORKSPACE\"
              python3 -m venv --system-site-packages venv
              ./venv/bin/python -m pip install --upgrade pip
              ./venv/bin/python -m pip install \
                -r ui/requirements.txt pytest \"pyright[nodejs]\" ruff
            "

      - name: Run tests, type checks, and linting
        run: |
          /app/bin/Xvfb :99 -screen 0 1280x720x24 >/tmp/clipper-xvfb.log 2>&1 &
          xvfb_pid=$!
          trap 'kill "$xvfb_pid" 2>/dev/null || true' EXIT
          DISPLAY=:99 flatpak run \
            --socket=x11 \
            --filesystem="$GITHUB_WORKSPACE" \
            --env=DISPLAY=:99 \
            --command=sh org.gnome.Sdk//51 -c "
              set -e
              cd \"$GITHUB_WORKSPACE\"
              env -u FLATPAK_ID ./tools/run_pytest_quiet.sh
            "

      - name: Verify tag and application versions agree
        id: version
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch --force origin \
            "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          if [ "$(git cat-file -t "$GITHUB_REF")" != "tag" ]; then
            echo "Release tags must be annotated." >&2
            exit 1
          fi
          python3 tools/validate_release_version.py "$GITHUB_REF_NAME"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  publish:
    name: Build and publish Flatpak
    needs: verify
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Generate categorized release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python3 tools/generate_release_notes.py "$TAG" \
            --repository "$GITHUB_REPOSITORY" \
            --output release-notes.md

      - name: Install GNOME 51 runtime and SDK
        run: flatpak install --noninteractive flathub org.gnome.Platform//51 org.gnome.Sdk//51

      - name: Build Flatpak bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: packaging/flatpak/io.github.leesethefox.Clipper.yml
          bundle: Clipper-${{ needs.verify.outputs.version }}-x86_64.flatpak
          cache-key: clipper-flatpak-${{ hashFiles('packaging/flatpak/io.github.leesethefox.Clipper.yml') }}
          upload-artifact: false

      - name: Validate built game-capture artifacts
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          bundle="Clipper-${VERSION}-x86_64.flatpak"
          flatpak --user install --noninteractive --or-update "$bundle"
          deployment="$(flatpak --user info --show-location io.github.leesethefox.Clipper)/files"
          python3 tools/validate_game_capture_payload.py "$deployment" \
            --report game-capture-payload-report.txt

      - name: Store game-capture artifact report
        uses: actions/upload-artifact@v4
        with:
          name: game-capture-payload-report
          path: game-capture-payload-report.txt

      - name: Prepare update assets
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          bundle="Clipper-${VERSION}-x86_64.flatpak"
          python3 tools/generate_update_manifest.py "$VERSION" "$bundle" --output update-x86_64.json
          cp "$bundle" Clipper-x86_64.flatpak
          sha256sum "$bundle" Clipper-x86_64.flatpak > SHA256SUMS

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.verify.outputs.version }}
          BUNDLE: Clipper-${{ needs.verify.outputs.version }}-x86_64.flatpak
        run: python3 tools/publish_github_release.py
