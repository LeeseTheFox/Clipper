name: Publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release source
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes python3-gi gir1.2-adw-1 gir1.2-gtk-4.0
          python3 -m venv --system-site-packages venv
          ./venv/bin/python -m pip install --upgrade pip
          ./venv/bin/python -m pip install -r ui/requirements.txt pytest pyright ruff

      - name: Run tests, type checks, and linting
        run: ./tools/run_pytest_quiet.sh

      - name: Verify tag and application versions agree
        id: version
        run: |
          if [ "$(git cat-file -t "$GITHUB_REF")" != "tag" ]; then
            echo "Release tags must be annotated." >&2
            exit 1
          fi
          ./venv/bin/python tools/validate_release_version.py "$GITHUB_REF_NAME"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  publish:
    name: Build and publish Flatpak
    needs: verify
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Generate categorized release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 tools/generate_release_notes.py "$TAG" \
            --repository "$GITHUB_REPOSITORY" \
            --output release-notes.md

      - name: Build Flatpak bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: packaging/flatpak/io.github.leesethefox.Clipper.yml
          bundle: Clipper-${{ needs.verify.outputs.version }}-x86_64.flatpak
          cache-key: clipper-flatpak-${{ hashFiles('packaging/flatpak/io.github.leesethefox.Clipper.yml') }}
          upload-artifact: false

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.verify.outputs.version }}
          BUNDLE: Clipper-${{ needs.verify.outputs.version }}-x86_64.flatpak
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Clipper ${VERSION}" \
              --notes-file release-notes.md
            gh release upload "$TAG" "$BUNDLE#Clipper ${VERSION} (x86_64)" --clobber
          else
            gh release create "$TAG" "$BUNDLE#Clipper ${VERSION} (x86_64)" \
              --title "Clipper ${VERSION}" --notes-file release-notes.md --verify-tag
          fi
