[project]
name = "clipper"
version = "1.0.6"
description = "Game clip recorder for Linux"
requires-python = ">=3.10"
dependencies = [
    "PyGObject>=3.42.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["ui"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
ignore = [
    "E402",  # Module level import not at top of file (required for gi.require_version)
]

[tool.ruff.lint.per-file-ignores]
"ui/__init__.py" = ["F401"]  # Allow unused imports in __init__.py
